# First-party crawler HTML worker. Replaces prerender.io.
# Keep the Cloudflare Worker name `prerender-worker` so the existing
# Workers Route can be updated in place (crawlers → this worker,
# humans → SPA origin).
name = "prerender-worker"
main = "src/index.js"
compatibility_date = "2026-08-27"
workers_dev = true

# HTML document routes only — do NOT attach this worker to /assets/*
# or static files. That keeps human SPA traffic on the origin and
# stays inside the Workers free-tier request budget.
#
# Dashboard (Workers → prerender-worker → Settings → Domains & Routes)
# or uncomment after `npx wrangler login` if this account owns the zone:
#
# routes = [
#   { pattern = "flashmovies.xyz/", zone_name = "flashmovies.xyz" },
#   { pattern = "flashmovies.xyz/movie-info*", zone_name = "flashmovies.xyz" },
#   { pattern = "flashmovies.xyz/full-movie*", zone_name = "flashmovies.xyz" },
#   { pattern = "flashmovies.xyz/list-items*", zone_name = "flashmovies.xyz" },
#   { pattern = "flashmovies.xyz/terms-and-conditions*", zone_name = "flashmovies.xyz" },
#   { pattern = "flashmovies.xyz/pro-plan-terms-and-conditions*", zone_name = "flashmovies.xyz" },
#   { pattern = "flashmovies.xyz/frequently-asked-questions*", zone_name = "flashmovies.xyz" },
#   { pattern = "flashmovies.xyz/auth*", zone_name = "flashmovies.xyz" },
#   { pattern = "flashmovies.xyz/payments*", zone_name = "flashmovies.xyz" },
#   { pattern = "www.flashmovies.xyz/", zone_name = "flashmovies.xyz" },
#   { pattern = "www.flashmovies.xyz/movie-info*", zone_name = "flashmovies.xyz" },
#   { pattern = "www.flashmovies.xyz/full-movie*", zone_name = "flashmovies.xyz" },
#   { pattern = "www.flashmovies.xyz/list-items*", zone_name = "flashmovies.xyz" },
#   { pattern = "www.flashmovies.xyz/terms-and-conditions*", zone_name = "flashmovies.xyz" },
#   { pattern = "www.flashmovies.xyz/pro-plan-terms-and-conditions*", zone_name = "flashmovies.xyz" },
#   { pattern = "www.flashmovies.xyz/frequently-asked-questions*", zone_name = "flashmovies.xyz" },
#   { pattern = "www.flashmovies.xyz/auth*", zone_name = "flashmovies.xyz" },
#   { pattern = "www.flashmovies.xyz/payments*", zone_name = "flashmovies.xyz" },
# ]

[vars]
SITE_ORIGIN = "https://flashmovies.xyz"
SITE_NAME = "Flash Movies"
# Detail pages (movie / TV / person): 6 hours
CACHE_TTL_SECONDS = "21600"
# Homepage and other static catalog pages: 24 hours
HOME_CACHE_TTL_SECONDS = "86400"

# TMDB_API_KEY is a secret (same string as apps/web VITE_API_KEY):
#   npx wrangler secret put TMDB_API_KEY
# Do not put the token in this file.

[observability]
enabled = false
