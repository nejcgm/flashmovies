# First-party crawler HTML worker. Replaces the live prerender.io proxy.
# Worker name must stay `prerender-worker` (account production env).
# flashmovies.xyz currently has ZERO Workers Routes — this worker only
# lives at *.workers.dev until a zone route is attached after merge.
name = "prerender-worker"
main = "src/index.js"
compatibility_date = "2026-08-27"
workers_dev = true
account_id = "d4d5dea420b3c5c51f6e9a5a85820759"

# AFTER MERGE: attach a zone route so crawlers on the real domain hit this
# worker. Dashboard: Workers → prerender-worker → Settings → Domains & Routes
#   Route: flashmovies.xyz/*
#   Route: www.flashmovies.xyz/*
# Failure mode: Fail open (proceed).
#
# Zone routes — crawlers on flashmovies.xyz hit this worker (humans still get SPA).
routes = [
  { pattern = "flashmovies.xyz/*", zone_name = "flashmovies.xyz" },
  { pattern = "www.flashmovies.xyz/*", zone_name = "flashmovies.xyz" },
]

[vars]
SITE_ORIGIN = "https://flashmovies.xyz"
SITE_NAME = "Flash Movies"
# Detail pages (movie / TV / person): 6 hours
CACHE_TTL_SECONDS = "21600"
# Homepage and other static catalog pages: 24 hours
HOME_CACHE_TTL_SECONDS = "86400"
# Bump when crawler HTML shape changes (invalidates Cache API entries).
CACHE_KEY_VERSION = "4"

# TMDB_API_KEY is a secret (same string as apps/web VITE_API_KEY):
#   npx wrangler secret put TMDB_API_KEY
# Do not put the token in this file.
# After prerender.io is cancelled, delete the old unused secret in the
# dashboard (Workers → prerender-worker → Settings → Variables). Do not
# commit or print that value.

[observability]
enabled = false
